name: paynest
description: PayNest - Premium Point of Sale App for Android & iOS
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2
  flutter_riverpod: ^2.5.1

  # Local Database & Storage
  sqflite: ^2.3.3+1
  sqflite_common_ffi_web: ^1.2.0
  path: ^1.9.0
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Components
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  badges: ^3.1.2
  lottie: ^3.1.2
  smooth_page_indicator: ^1.1.0
  flutter_svg: ^2.0.10+1
  percent_indicator: ^4.2.3

  # Barcode & QR
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # PDF & Printing
  pdf: ^3.11.1
  printing: ^5.13.2

  # Connectivity & Networking
  connectivity_plus: ^6.1.0
  http: ^1.2.2
  dio: ^5.7.0

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1

  # Security & Auth
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  crypto: ^3.0.5
  encrypt: ^5.0.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  share_plus: ^10.0.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^17.2.4
  path_provider: ^2.1.4
  collection: ^1.18.0
  equatable: ^2.0.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
